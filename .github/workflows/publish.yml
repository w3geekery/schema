name: Publish Schema

on:
  push:
    branches: [main, qa, dev, uat]
    paths:
      - 'package/**'
      - 'bundle/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      schema:
        description: 'Schema to publish (e.g. hl7/fhir, zerobias/zerobias/base). Leave blank for all changed.'
        required: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    uses: zerobias-org/devops/.github/workflows/zbb-publish-reusable.yml@main
    with:
      ghcr-namespace: zerobias-org
      dispatch-input-name: schema
      dispatch-input-value: ${{ inputs.schema }}
    secrets: inherit
