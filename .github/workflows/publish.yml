name: Publish Schema

on:
  push:
    branches: [main, qa, dev, uat]
    paths:
      - 'package/**'
      - 'bundle/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      schema:
        description: 'Schema to publish (e.g. hl7/fhir, zerobias/zerobias/base). Leave blank for all changed.'
        required: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    uses: zerobias-org/devops/.github/workflows/zbb-publish-reusable.yml@main
    with:
      ghcr-namespace: zerobias-org
      dispatch-input-name: schema
      dispatch-input-value: ${{ inputs.schema }}
      # The reusable's sync job runs in parallel with our update-bundle.
      # We disable it so our custom sync below can run AFTER bundle
      # commits to main — keeping uat/qa/dev branches in lockstep with
      # the bundle commit, not behind it.
      skip-sync: true
    secrets: inherit

  # ── Bundle update — runs after the publish matrix succeeds ──
  #
  # Reads the npm registry (NOT on-disk package.json) as the source of
  # truth so packages whose publish failed in the matrix don't get
  # pinned at phantom versions. Bumps bundle patch only when deps
  # actually changed; otherwise no-ops cleanly.
  #
  # Only runs when publish was 100% successful — matrix partial-failure
  # → bundle stays at whatever's currently published (matches user spec
  # answer "if matrix fails, skip").
  update-bundle:
    needs: publish
    if: |
      github.ref == 'refs/heads/main' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      bundle-changed: ${{ steps.publish-bundle.outputs.bundle-changed }}
      bundle-version: ${{ steps.publish-bundle.outputs.bundle-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: https://npm.pkg.github.com/
          scope: '@zerobias-org'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Refresh bundle/package.json from npm
        env:
          # settings.gradle.kts's GH Packages Maven repo reads its
          # credentials from these env vars. Also needed for `npm view`
          # to read the @zerobias-org scope.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew updateBundle --no-daemon

      - name: Read status + decide whether to publish
        id: publish-bundle
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(cat build/bundle-update.status 2>/dev/null || echo "no-change")
          echo "status: $status"
          if [[ "$status" == no-change* ]]; then
            echo "Bundle deps already match npm — nothing to publish"
            echo "bundle-changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          new_version="${status#changed:}"
          echo "Bundle changed → $new_version. Committing + publishing."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bundle/package.json
          git commit -m "chore(bundle): refresh deps (${new_version}) [skip ci]"
          git push origin HEAD:main

          cd bundle
          # publish uses NODE_AUTH_TOKEN against the registry/scope set
          # in setup-node.
          npm publish

          echo "bundle-changed=true" >> "$GITHUB_OUTPUT"
          echo "bundle-version=${new_version}" >> "$GITHUB_OUTPUT"

  # ── Sync env branches — runs AFTER bundle update so propagated
  # branches (uat/qa/dev) include the bundle commit, not just the
  # per-package version-bump commit.
  sync:
    needs: [publish, update-bundle]
    if: |
      github.ref == 'refs/heads/main' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: zerobias-org/devops/nx-actions/sync-branches@main
