description: "Post-engagement review/rating of a provider"
extends:
  - Object
properties:
  - rating:
    field: review.rating
  - reviewText:
    field: review.reviewText
  - status:
    field: review.status
  - engagement:
      linkTo: Engagement.id.reviews
  - approvalTask:
      linkTo: Task
      uniLink: true
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Rating":
    jsonata: rating
    sort: rating
  "Status":
    jsonata: status
    sort: status
