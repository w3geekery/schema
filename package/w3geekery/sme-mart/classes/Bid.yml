description: "A vendor's bid/response to an engagement/RFP"
extends:
  - Object
properties:
  - coverLetter:
    field: bid.coverLetter
  - price:
    field: bid.price
  - status:
    field: bid.status
  - timeline:
    field: bid.timeline
  - engagement:
    linkTo: Engagement.id.bids
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Price":
    jsonata: price
    sort: price
  "Status":
    jsonata: status
    sort: status
