description: "A buyer engagement/RFP in the SME marketplace"
extends:
  - Object
properties:
  - category:
    field: engagement.category
  - status:
    field: engagement.status
  - budgetMin:
    field: engagement.budgetMin
  - budgetMax:
    field: engagement.budgetMax
  - timeline:
    field: engagement.timeline
  - engagementTag:
    field: engagement.engagementTag
  - proposals:
    linkTo: Proposal.id.engagement
    multi: true
  - reviews:
    linkTo: Review.id.engagement
    multi: true
  - notes:
    linkTo: Note.id.engagement
    multi: true
  - documents:
    linkTo: SmeMartDocument.id.engagement
    multi: true
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Status":
    jsonata: status
    sort: status
  "Category":
    jsonata: category
    sort: category
