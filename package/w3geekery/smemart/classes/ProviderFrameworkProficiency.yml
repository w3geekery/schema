# Renamed from ProviderFramework (Cluster B, D-61 + #343). NOT a rename in place — see
# ProviderSkillProficiency.yml for why these three are new files rather than edits.
description: "Org-scoped expertise junction: a provider Org's claimed experience with a Catalog Framework (CMMC, FedRAMP, ISO 27001, etc.). One row per (org, framework) claim with its own verification provenance (D-53). Framework name resolved from the Catalog on read (not denormalized)."
extends:
  - Object
  - Verifiable
properties:
  - orgId:
    field: providerFrameworkProficiency.orgId
  - frameworkId:
    field: providerFrameworkProficiency.frameworkId
  - proficiencyLevel:
    field: providerFrameworkProficiency.proficiencyLevel
  - yearsExperience:
    field: providerFrameworkProficiency.yearsExperience
  - assessorCertified:
    field: providerFrameworkProficiency.assessorCertified
  - implementationExperience:
    field: providerFrameworkProficiency.implementationExperience
  - auditExperience:
    field: providerFrameworkProficiency.auditExperience
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Proficiency":
    jsonata: proficiencyLevel
    sort: proficiencyLevel
  "Verified":
    jsonata: verified
    sort: verified
