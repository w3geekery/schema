description: "Org-scoped marketplace classification: links a platform Org to a Catalog Segment (Domain or Category) — replaces the free-text 'industry' field. Applies to BOTH buyer and vendor orgs. One row per (org, segment) claim, carrying its own verification provenance (D-53). Segment type/name resolved from the Catalog on read (not denormalized). Distinct from VendorSegment (expertise) — OrgSegment is universal classification."
extends:
  - Object
  - Verifiable
properties:
  - orgId:
    field: orgSegment.orgId
  - segmentId:
    field: orgSegment.segmentId
  - isPrimary:
    field: orgSegment.isPrimary
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Primary":
    jsonata: isPrimary
    sort: isPrimary
  "Verified":
    jsonata: verified
    sort: verified
