description: "Owner-generic postal address for SME Mart. Owner is a reference (ownerType + ownerId), not org-locked — usable by orgs (providers and buyers) now, personnel/user later, with no breaking change. Typed scalar address fields (no JSON blob). addressType is the machine-routable category (billing/shipping/registered/KYB); userLabel is optional free-text human disambiguation, never routed on. Verification metadata is nullable from v1 so KYB (vetting) needs no breaking change. Mirrors the shape of a future platform Address so it can supersede cleanly."
extends:
  - Object
properties:
  - ownerType:
    field: address.ownerType
  - ownerId:
    field: address.ownerId
  - addressType:
    field: address.addressType
  - userLabel:
    field: address.userLabel
  - street1:
    field: address.street1
  - street2:
    field: address.street2
  - city:
    field: address.city
  - region:
    field: address.region
  - postalCode:
    field: address.postalCode
  - country:
    field: address.country
  - isPrimary:
    field: address.isPrimary
  - verified:
    field: address.verified
  - verifiedAt:
    field: address.verifiedAt
  - verificationSource:
    field: address.verificationSource
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Type":
    jsonata: addressType
    sort: addressType
  "City":
    jsonata: city
    sort: city
  "Region":
    jsonata: region
    sort: region
  "Primary":
    jsonata: isPrimary
    sort: isPrimary
