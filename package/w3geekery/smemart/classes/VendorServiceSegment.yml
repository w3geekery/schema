description: "Org-scoped expertise junction: a service a vendor Org offers, keyed to a Catalog Service-type Segment. One row per (org, serviceSegment) claim with its own verification provenance (D-53). Service-segment name resolved from the Catalog on read (not denormalized)."
extends:
  - Object
  - Verifiable
properties:
  - orgId:
    field: vendorServiceSegment.orgId
  - serviceSegmentId:
    field: vendorServiceSegment.serviceSegmentId
  - isPrimary:
    field: vendorServiceSegment.isPrimary
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Primary":
    jsonata: isPrimary
    sort: isPrimary
  "Verified":
    jsonata: verified
    sort: verified
