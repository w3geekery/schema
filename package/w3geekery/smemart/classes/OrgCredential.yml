description: "Organization holds an org-scope security credential (C3PAO authorization, FedRAMP authorization, SOC 2 report, etc.). Links a platform Org to an SME Mart SecurityCredential with issue/expiry dates and verification state."
extends:
  - Object
  - Verifiable
properties:
  - orgId:
    field: orgCredential.orgId
  - issuedAt:
    field: orgCredential.issuedAt
  - expiresAt:
    field: orgCredential.expiresAt
  - credentialNumber:
    field: orgCredential.credentialNumber
  - notes:
    field: orgCredential.notes
  - securityCredential:
    linkTo: SecurityCredential.id.orgCredentials
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Verified":
    jsonata: verified
    sort: verified
  "Expires":
    jsonata: expiresAt
    sort: expiresAt
