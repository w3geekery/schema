description: "Org-scoped expertise junction: a provider Org's claimed experience with a Catalog Framework (CMMC, FedRAMP, ISO 27001, etc.). One row per (org, framework) claim with its own verification provenance (D-53). Framework name resolved from the Catalog on read (not denormalized)."
extends:
  - Object
properties:
  - orgId:
    field: providerFramework.orgId
  - frameworkId:
    field: providerFramework.frameworkId
  - proficiencyLevel:
    field: providerFramework.proficiencyLevel
  - yearsExperience:
    field: providerFramework.yearsExperience
  - assessorCertified:
    field: providerFramework.assessorCertified
  - implementationExperience:
    field: providerFramework.implementationExperience
  - auditExperience:
    field: providerFramework.auditExperience
  - verified:
    field: providerFramework.verified
  - verificationSource:
    field: providerFramework.verificationSource
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Proficiency":
    jsonata: proficiencyLevel
    sort: proficiencyLevel
  "Verified":
    jsonata: verified
    sort: verified
