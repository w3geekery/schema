description: "Corp-to-corp agreement between buyer and provider orgs. Projects relate via platform resource links (relates_to), not parent-child."
extends:
  - Object
properties:
  - buyerZerobiasUserId:
    field: engagement.buyerZerobiasUserId
  - buyerZerobiasOrgId:
    field: engagement.buyerZerobiasOrgId
  - zerobiasTagId:
    field: engagement.zerobiasTagId
  - zerobiasTaskId:
    field: engagement.zerobiasTaskId
  - status:
    field: engagement.status
  - engagementTag:
    field: engagement.engagementTag
  - bids:
    linkTo: Bid.id.engagement
    multi: true
  - reviews:
    linkTo: Review.id.engagement
    multi: true
  - notes:
    linkTo: Note.id.engagement
    multi: true
  - documents:
    linkTo: SmeMartDocument.id.engagement
    multi: true
  - noteFolders:
    linkTo: NoteFolder.id.engagement
    multi: true
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Status":
    jsonata: status
    sort: status
  "Tag":
    jsonata: engagementTag
    sort: engagementTag
