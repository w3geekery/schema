description: "Corp-to-corp agreement between a buyer org and a provider org in the SME Mart marketplace. Projects relate to an engagement via platform resource links (relates_to), not parent-child. **DEPRECATED (Phase 29.5):** Use `platform.Project` instead (top-level Project: parentId=null, ownerId=buyerOrgId, identity tag via tagId). This class is retained during the dual-read window (Phases 29.5–31) to support legacy data. Delete is deferred to post-closure once all readers have migrated (see backlog SCHEMA-RETIREMENT-DELETE-1)."
deprecated: true
extends:
  - Object
properties:
  - buyerZerobiasUserId:
    field: engagement.buyerZerobiasUserId
  - buyerZerobiasOrgId:
    field: engagement.buyerZerobiasOrgId
  - zerobiasTagId:
    field: engagement.zerobiasTagId
  - zerobiasTaskId:
    field: engagement.zerobiasTaskId
  - status:
    field: engagement.status
  - engagementTag:
    field: engagement.engagementTag
  - facilitatorUserId:
    field: engagement.facilitatorUserId
  - communicationMode:
    field: engagement.communicationMode
  - reviews:
    linkTo: Review.id.engagement
    multi: true
  - notes:
    linkTo: Note.id.engagement
    multi: true
  - documents:
    linkTo: SmeMartDocument.id.engagement
    multi: true
  - noteFolders:
    linkTo: NoteFolder.id.engagement
    multi: true
  - vettingItems:
    linkTo: EngagementVettingItem.id.engagement
    multi: true
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Status":
    jsonata: status
    sort: status
  "Tag":
    jsonata: engagementTag
    sort: engagementTag
