description: "Scoped work container under an Engagement. References 1+ ZB Boundaries. Children inherit permissions."
extends:
  - Object
properties:
  - status:
    field: project.status
  - ownerType:
    field: project.ownerType
  - startDate:
    field: project.startDate
  - targetEndDate:
    field: project.targetEndDate
  - boundaryIds:
    field: project.boundaryIds
  - engagement:
    linkTo: Engagement.id.projects
  - boards:
    linkTo: SmeMartBoard.id.project
    multi: true
  - prds:
    linkTo: ProjectPrd.id.project
    multi: true
  - plans:
    linkTo: ProjectPlan.id.project
    multi: true
  - notes:
    linkTo: Note.id.project
    multi: true
  - documents:
    linkTo: SmeMartDocument.id.project
    multi: true
  - noteFolders:
    linkTo: NoteFolder.id.project
    multi: true
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Status":
    jsonata: status
    sort: status
  "Owner Type":
    jsonata: ownerType
    sort: ownerType
