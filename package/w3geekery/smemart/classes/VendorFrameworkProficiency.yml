# Renamed from ProviderFrameworkProficiency (2026-08-13), which was itself renamed from
# ProviderFramework (Cluster B, D-61 + #343). NOT a rename in place — see VendorSkillProficiency.yml
# for why each of these is a new file rather than an edit.
description: "Org-scoped expertise junction: a vendor Org's claimed experience with a Catalog Framework (CMMC, FedRAMP, ISO 27001, etc.). One row per (org, framework) claim with its own verification provenance (D-53). Framework name resolved from the Catalog on read (not denormalized)."
extends:
  - Object
  - Verifiable
properties:
  - orgId:
    field: vendorFrameworkProficiency.orgId
  - frameworkId:
    field: vendorFrameworkProficiency.frameworkId
  - proficiencyLevel:
    field: vendorFrameworkProficiency.proficiencyLevel
  - yearsExperience:
    field: vendorFrameworkProficiency.yearsExperience
  - assessorCertified:
    field: vendorFrameworkProficiency.assessorCertified
  - implementationExperience:
    field: vendorFrameworkProficiency.implementationExperience
  - auditExperience:
    field: vendorFrameworkProficiency.auditExperience
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Proficiency":
    jsonata: proficiencyLevel
    sort: proficiencyLevel
  "Verified":
    jsonata: verified
    sort: verified
