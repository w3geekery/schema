description: "Org-scoped expertise junction: a provider Org's claimed proficiency in a Catalog Skill. One row per (org, skill) claim with its own verification provenance (D-53). Skill name resolved from the Catalog on read (not denormalized). Buyer orgs have zero of these."
extends:
  - Object
properties:
  - orgId:
    field: providerSkill.orgId
  - skillId:
    field: providerSkill.skillId
  - proficiencyLevel:
    field: providerSkill.proficiencyLevel
  - yearsExperience:
    field: providerSkill.yearsExperience
  - verified:
    field: providerSkill.verified
  - verificationSource:
    field: providerSkill.verificationSource
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Proficiency":
    jsonata: proficiencyLevel
    sort: proficiencyLevel
  "Verified":
    jsonata: verified
    sort: verified
