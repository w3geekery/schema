description: "Typed key-personnel record for an Org. One row per person. Person-held certifications are NOT stored here — they hang off UserCertification via userId. Background-check state captured as a typed enum. Verification metadata supports asserted-vs-verified (D-53)."
extends:
  - Object
  - VendorAttestationBase
properties:
  - orgId:
    field: personnel.orgId
  - userId:
    field: personnel.userId
  - fullName:
    field: personnel.fullName
  - title:
    field: personnel.title
  - specialization:
    field: personnel.specialization
  - bio:
    field: personnel.bio
  - email:
    field: personnel.email
  - linkedinUrl:
    field: personnel.linkedinUrl
  - isKeyPersonnel:
    field: personnel.isKeyPersonnel
  - backgroundCheckStatus:
    field: personnel.backgroundCheckStatus
  - roleId:
    field: personnel.roleId
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Title":
    jsonata: title
    sort: title
  "Background Check":
    jsonata: backgroundCheckStatus
    sort: backgroundCheckStatus
