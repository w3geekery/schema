description: "Engagement/project/notes-scoped instance of a document template with variables substituted"
extends:
  - Object
properties:
  - documentType:
    field: documentInstance.documentType
  - content:
    field: documentInstance.content
  - templateId:
    field: documentInstance.templateId
  - templateVersion:
    field: documentInstance.templateVersion
  - variableValues:
    field: documentInstance.variableValues
  - engagementId:
    field: documentInstance.engagementId
  - projectId:
    field: documentInstance.projectId
  - status:
    field: documentInstance.status
  - project:
    linkTo: SmeMartProject.id.documentInstances
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Type":
    jsonata: documentType
    sort: documentType
  "Status":
    jsonata: status
    sort: status
  "Template ID":
    jsonata: templateId
    sort: templateId
