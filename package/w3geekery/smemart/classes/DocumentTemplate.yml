description: "Org-level reusable document template with variable placeholders"
extends:
  - Object
properties:
  - documentType:
    field: documentTemplate.documentType
  - content:
    field: documentTemplate.content
  - variableSchema:
    field: documentTemplate.variableSchema
  - version:
    field: documentTemplate.version
  - status:
    field: documentTemplate.status
  - orgId:
    field: documentTemplate.orgId
  - createdBy:
    field: documentTemplate.createdBy
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Type":
    jsonata: documentType
    sort: documentType
  "Status":
    jsonata: status
    sort: status
  "Version":
    jsonata: version
    sort: version
