description: "Individual user holds a security credential. Links a platform User to an SME Mart SecurityCredential with issue/expiry dates, verification state, and credential number. Used by Seller profile to claim individual-scope credentials (CISSP, CCA, OSCP, etc.)."
extends:
  - Object
  - Verifiable
properties:
  - userId:
    field: userCredential.userId
  - issuedAt:
    field: userCredential.issuedAt
  - expiresAt:
    field: userCredential.expiresAt
  - credentialNumber:
    field: userCredential.credentialNumber
  - notes:
    field: userCredential.notes
  - securityCredential:
    linkTo: SecurityCredential.id.userCredentials
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Verified":
    jsonata: verified
    sort: verified
  "Expires":
    jsonata: expiresAt
    sort: expiresAt
