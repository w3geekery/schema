description: "Vendor form submission responses linked to bid and project"
extends:
  - Object
properties:
  - projectId:
    field: formSubmission.projectId
  - bidId:
    field: formSubmission.bidId
  - submissionData:
    field: formSubmission.submissionData
  - status:
    field: formSubmission.status
  - submittedAt:
    field: formSubmission.submittedAt
  - reviewedAt:
    field: formSubmission.reviewedAt
  - reviewedBy:
    field: formSubmission.reviewedBy
  - project:
    linkTo: SmeMartProject.id.formSubmissions
  - bid:
    linkTo: Bid.id.formSubmission
viewProperties:
  "Project":
    jsonata: projectId
    sort: projectId
  "Status":
    jsonata: status
    sort: status
  "Submitted At":
    jsonata: submittedAt
    sort: submittedAt
