description: "Rich-text engagement note"
extends:
  - Object
properties:
  - engagementId:
    field: note.engagementId
  - folderId:
    field: note.folderId
  - archived:
    field: note.archived
  - authorZerobiasUserId:
    field: note.authorZerobiasUserId
  - isMeetingMinutes:
    field: note.isMeetingMinutes
  - boundaryId:
    field: note.boundaryId
  - projectId:
    field: note.projectId
  - content:
    field: note.content
  - accessLevel:
    field: note.accessLevel
  - folder:
    linkTo: NoteFolder.id.notes
  - engagement:
    linkTo: Engagement.id.notes
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Access":
    jsonata: accessLevel
    sort: accessLevel
