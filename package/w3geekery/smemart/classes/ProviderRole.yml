description: "Org-scoped expertise junction: a provider Org's claimed Catalog Role. One row per (org, role) claim with its own verification provenance (D-53). Role name resolved from the Catalog on read (not denormalized)."
extends:
  - Object
  - Verifiable
properties:
  - orgId:
    field: providerRole.orgId
  - roleId:
    field: providerRole.roleId
  - isPrimary:
    field: providerRole.isPrimary
  - yearsInRole:
    field: providerRole.yearsInRole
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Primary":
    jsonata: isPrimary
    sort: isPrimary
  "Verified":
    jsonata: verified
    sort: verified
