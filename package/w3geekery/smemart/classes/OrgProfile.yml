description: "1:1 typed company profile for a platform Org in SME Mart — identity, marketing, and discovery fields layered above the platform Org's identity. One per org (orgId unique). Addresses live in the Address class; industry/classification lives in OrgSegment; private onboarding state lives in PKV. Read name/avatar/slug from the platform Org, not here."
extends:
  - Object
properties:
  - orgId:
    field: orgProfile.orgId
  - legalName:
    field: orgProfile.legalName
  - dba:
    field: orgProfile.dba
  - tagline:
    field: orgProfile.tagline
  - shortDescription:
    field: orgProfile.shortDescription
  - longDescription:
    field: orgProfile.longDescription
  - website:
    field: orgProfile.website
  - logoUrl:
    field: orgProfile.logoUrl
  - employeeCount:
    field: orgProfile.employeeCount
  - foundedYear:
    field: orgProfile.foundedYear
  - primaryContactUserId:
    field: orgProfile.primaryContactUserId
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Legal Name":
    jsonata: legalName
    sort: legalName
  "Website":
    jsonata: website
    sort: website
  "Employees":
    jsonata: employeeCount
    sort: employeeCount
