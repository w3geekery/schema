description: "Org-scoped expertise junction: a provider Org's claimed proficiency with a Catalog Product. One row per (org, product) claim with its own verification provenance (D-53). Product name resolved from the Catalog on read (not denormalized)."
extends:
  - Object
properties:
  - orgId:
    field: providerProduct.orgId
  - productId:
    field: providerProduct.productId
  - proficiencyLevel:
    field: providerProduct.proficiencyLevel
  - yearsExperience:
    field: providerProduct.yearsExperience
  - certified:
    field: providerProduct.certified
  - certificationDetails:
    field: providerProduct.certificationDetails
  - verified:
    field: providerProduct.verified
  - verificationSource:
    field: providerProduct.verificationSource
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Proficiency":
    jsonata: proficiencyLevel
    sort: proficiencyLevel
  "Certified":
    jsonata: certified
    sort: certified
