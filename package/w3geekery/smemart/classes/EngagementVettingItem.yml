description: "Corporate vetting checklist item for an engagement (D&B, MSA, insurance, etc.). Bidirectional: buyer and provider each have requirements. **DEPRECATED (Phase 29.5):** Use paired `platform.Task` on a `platform.Board` (boardType='list') instead — parent task + one subtask per side (buyer/provider). This class is retained during the dual-read window (Phases 29.5–31) to support legacy data. Delete is deferred to post-closure once all readers have migrated (see backlog SCHEMA-RETIREMENT-DELETE-1)."
deprecated: true
extends:
  - Object
properties:
  - engagementId:
    field: vettingItem.engagementId
  - category:
    field: vettingItem.category
  - vettingType:
    field: vettingItem.vettingType
  - evidenceType:
    field: vettingItem.evidenceType
  - status:
    field: vettingItem.status
  - direction:
    field: vettingItem.direction
  - conditionTrigger:
    field: vettingItem.conditionTrigger
  - documentIds:
    field: vettingItem.documentIds
  - submittedAt:
    field: vettingItem.submittedAt
  - verifiedAt:
    field: vettingItem.verifiedAt
  - verifiedBy:
    field: vettingItem.verifiedBy
  - expiresAt:
    field: vettingItem.expiresAt
  - rejectionReason:
    field: vettingItem.rejectionReason
  - waivedReason:
    field: vettingItem.waivedReason
  - notes:
    field: vettingItem.notes
  - profileItemId:
    field: vettingItem.profileItemId
  - engagement:
    linkTo: Engagement.id.vettingItems
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Status":
    jsonata: status
    sort: status
  "Category":
    jsonata: category
    sort: category
  "Direction":
    jsonata: direction
    sort: direction
