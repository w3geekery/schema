description: "Org-scoped expertise junction: a service a provider Org offers, keyed to a Catalog Service-type Segment. One row per (org, serviceSegment) claim with its own verification provenance (D-53). Service-segment name resolved from the Catalog on read (not denormalized)."
extends:
  - Object
properties:
  - orgId:
    field: providerServiceSegment.orgId
  - serviceSegmentId:
    field: providerServiceSegment.serviceSegmentId
  - isPrimary:
    field: providerServiceSegment.isPrimary
  - verified:
    field: providerServiceSegment.verified
  - verificationSource:
    field: providerServiceSegment.verificationSource
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Primary":
    jsonata: isPrimary
    sort: isPrimary
  "Verified":
    jsonata: verified
    sort: verified
