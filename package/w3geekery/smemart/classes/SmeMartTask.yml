description: "Task on a board, under an activity. Supports subtask hierarchy via parent link."
extends:
  - Object
properties:
  - code:
    field: task.code
  - rank:
    field: task.rank
  - phaseCode:
    field: task.phaseCode
  - status:
    field: task.status
  - priority:
    field: task.priority
  - dueDate:
    field: task.dueDate
  - sourceDocument:
    field: task.sourceDocument
  - board:
    linkTo: SmeMartBoard.id.tasks
  - activity:
    linkTo: SmeMartActivity.id.tasks
  - parent:
    linkTo: SmeMartTask.id.children
  - children:
    linkTo: SmeMartTask.id.parent
    multi: true
viewProperties:
  "Code":
    jsonata: code
    sort: code
  "Name":
    jsonata: name
    sort: name
  "Status":
    jsonata: status
    sort: status
  "Phase":
    jsonata: phaseCode
    sort: phaseCode
  "Due Date":
    jsonata: dueDate
    sort: dueDate
