description: "A vendor's bid on an RFP (SmeMartProject in published status)"
extends:
  - Object
properties:
  - vendorId:
    field: bid.vendorId
  - coverLetter:
    field: bid.coverLetter
  - price:
    field: bid.price
  - status:
    field: bid.status
  - timeline:
    field: bid.timeline
  - executiveSummary:
    field: bid.executiveSummary
  - teamDescription:
    field: bid.teamDescription
  - totalEstimatedHours:
    field: bid.totalEstimatedHours
  - pricingBreakdown:
    field: bid.pricingBreakdown
  - wizardData:
    field: bid.wizardData
  - wizardStep:
    field: bid.wizardStep
  - pricingModel:
    field: bid.pricingModel
  - bidValidUntil:
    field: bid.bidValidUntil
  - responses:
    linkTo: BidResponse.id.bid
    multi: true
  - projectId:
    field: bid.projectId
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Price":
    jsonata: price
    sort: price
  "Status":
    jsonata: status
    sort: status
