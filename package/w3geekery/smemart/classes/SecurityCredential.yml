description: "Curated catalog entry for a compliance / cybersecurity credential (CMMC CCA, CISSP, FedRAMP 3PAO, OSCP, CIPP, HITRUST CCSFP, SOC 2, etc.). Links to platform Vendor (issuer), Framework(s), and Role(s) via opaque UUID foreign keys. Carries scope (individual/org/product), moderation state, and source metadata. Sellers claim entries via UserCredential / OrgCredential."
extends:
  - Object
properties:
  - code:
    field: securityCredential.code
  - issuerVendorIds:
    field: securityCredential.issuerVendorIds
    multi: true
  - frameworkIds:
    field: securityCredential.frameworkIds
    multi: true
  - qualifiesForRoleIds:
    field: securityCredential.qualifiesForRoleIds
    multi: true
  - scope:
    field: securityCredential.scope
  - proficiency:
    field: securityCredential.proficiency
  - ecosystemCode:
    field: securityCredential.ecosystemCode
  - sourceUrl:
    field: securityCredential.sourceUrl
  - sourceSnapshotDate:
    field: securityCredential.sourceSnapshotDate
  - status:
    field: securityCredential.status
  - submittedByUserId:
    field: securityCredential.submittedByUserId
  - userCredentials:
    linkTo: UserCredential.id.securityCredential
    multi: true
  - orgCredentials:
    linkTo: OrgCredential.id.securityCredential
    multi: true
viewProperties:
  "Name":
    jsonata: name
    sort: name
  "Code":
    jsonata: code
    sort: code
  "Scope":
    jsonata: scope
    sort: scope
  "Ecosystem":
    jsonata: ecosystemCode
    sort: ecosystemCode
  "Status":
    jsonata: status
    sort: status
