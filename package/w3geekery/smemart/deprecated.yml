classes:
  - MarketplaceProfileItem
  # Cluster B renames (commit 5, D-61 + #343). NOT renamed in place -- class IDs are derived from
  # content, so each became a NEW *Proficiency class and the original is retired whole here. The
  # old class files were never edited; they kept their own verified/verificationSource declarations
  # right up to deletion, which is why they were deliberately excluded from commit 3b.
  #   ProviderSkill     -> ProviderSkillProficiency
  #   ProviderProduct   -> ProviderProductProficiency
  #   ProviderFramework -> ProviderFrameworkProficiency
  # The app's SME_MART_CLASS_IDS registry needs the new platform-assigned IDs once these land.
  - ProviderSkill
  - ProviderProduct
  - ProviderFramework
  # ── 2026-08-05 RETIREMENT WAVE (Clark) ──────────────────────────────────────────────────────
  # Fourteen classes retired in one batch. Three distinct reasons, recorded per class because
  # "it duplicates a platform primitive" is NOT sufficient on its own -- each had to be shown.
  #
  # A. ABSORBED BY A PLATFORM PRIMITIVE. The platform now does what these were invented to do.
  #    Engagement / SmeMartProject -> platform.Project (projectType enum carries engagement/rfp/pilot).
  #    SmeMartBoard -> platform.Board (strict superset; scope was redundant against Board's own
  #      ownerId/parentId/boundaryId/orgId, and partition was dead twice over -- schema said
  #      buyer/provider/shared, the app union said demand/supply/execution/P1, zero overlap).
  #    SmeMartTask / SmeMartActivity / SmeMartWorkflow -> platform Task / Activity / Workflow.
  #    SmeMartDocument -> FileService (it already extended File).
  #    Address -> the platform base `address` document; use the platform shape, do not re-declare it.
  - Engagement
  - SmeMartProject
  - SmeMartBoard
  - SmeMartTask
  - SmeMartActivity
  - SmeMartWorkflow
  - SmeMartDocument
  - Address
  #
  # B. WRONG STORE. These are not GQL-shaped data.
  #    Note / NoteFolder -> FileService. The zb/com/ui Projects App Notes tab already does
  #      everything smemart's Note did; NoteFolder had no non-self link except Note.id.folder, so
  #      without Note it is an empty folder tree.
  #    FormSubmission -> PKV shape, not GQL (Clark 2026-08-05).
  - Note
  - NoteFolder
  - FormSubmission
  #
  # C. REQUIREMENT<>SATISFACTION SHAPE, or cruft from a plan that will not be built.
  #    EngagementVettingItem was already deprecated: true in-tree, replacement documented as paired
  #      platform.Task on a platform.Board(boardType=list). It is req<>sat shape (Clark).
  #    DocumentTemplate / DocumentInstance were added 2026-04-10 for the Plan 015 / Phase 15
  #      document-templating system. That system will not be built. BACKLOG 054 (D2) and 087 both
  #      reference it and are now partly stale -- see the note filed with this batch.
  - EngagementVettingItem
  - DocumentTemplate
  - DocumentInstance
  #
  # D. SUPERSEDED BY A CLASS WE SHIPPED THE SAME DAY.
  #    ServiceOffering -> VendorListing (shipped in 2.0.7). Every field maps with nothing left over:
  #      isActive->active, deliveryTime->deliveryTime, providerId->ownerId,
  #      serviceIncludes->includesSummary, serviceRequirements->prerequisitesSummary,
  #      category/subcategory->family/kind/catalogRef, price/pricingType->offers (offerRef document).
  #      The listing-copy rename in PR #67 (includesSummary / prerequisitesSummary) was alignment with
  #      the class it replaces.
  - ServiceOffering
