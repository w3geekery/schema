id: 81ae1091-f93a-5bfa-b934-1ffd822ff7d3
description: A physical or digital token that provides access authentication such as cards, fobs, or mobile credentials
extends:
  - Asset
  - Principal
properties:
  - credentialType:
    field: accessCredential.type
  - accessLevel:
    field: accessCredential.level
  - isActive:
    field: accessCredential.isActive
  - validFrom:
    field: dateStart
  - validUntil:
    field: dateEnd
  # Links
  - principal:
    linkTo: Principal.id.accessCredentials
  - visitor:
    linkTo: Visitor.id.visitorPass
  - schedules:
    linkTo: Schedule.id.credentials
    multi: true
  - app:
    linkTo: PhysicalAccessManagementApp.id.credentials
  # accessRules inherited from Principal interface
