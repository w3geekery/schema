id: 0e6a86e8-cef1-5abd-97e3-8dae1e93669e
description: A logical grouping of access points within a site, representing areas with similar access requirements
extends:
  - Asset
  - Resource
properties:
  - capacity:
    field: accessZone.capacity
  - accessLevel:
    field: accessLevel
  # Links
  - site:
    linkTo: PhysicalSite.id.zones
  - entries:
    linkTo: PhysicalEntry.id.zone
    multi: true
  - visitors:
    linkTo: Visitor.id.allowedAreas
    multi: true
  - schedules:
    linkTo: Schedule.id.zones
    multi: true
  - app:
    linkTo: PhysicalAccessManagementApp.id.zones
  # accessRules inherited from Resource
