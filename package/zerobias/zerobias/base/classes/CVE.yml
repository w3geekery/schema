id: 96fe4f2d-0927-5037-a7e4-42f82e1f058b
description: CVE
extends:
  - Vulnerability
properties:
  - kev:
    field:
      type: boolean
      description: "True if the CVE is a KEV (Known Exploited Vulnerability)"
  - kevDiscovered:
    field:
      type: date
      description: "Date the CVE was discovered as a KEV"
  - kevDueDate:
    field:
      type: date
      description: "Date the CVE is due to be remediated"
  - kevKnownRansomwareUse:
    field:
      type: boolean
      description: "True if the CVE is known to be used by ransomware"
