description: Types of roles in identity and access management systems
displayName: Role Type
values:
  - ADMINISTRATIVE: 'Administrative or management role'
  - FUNCTIONAL: 'Function-based role (e.g., Developer, Analyst)'
  - SECURITY: 'Security-focused role'
