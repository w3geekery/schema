description: The type or category of access credential
displayName: Access Credential Type
values:
  - CARD: "Physical access card or badge"
  - FOB: "Key fob or proximity token"
  - MOBILE: "Mobile device credential or app"
  - BIOMETRIC: "Biometric credential (fingerprint, facial recognition, etc.)"
  - PIN: "Personal identification number"
  - TOKEN: "Security token or hardware key"
  - CERTIFICATE: "Digital certificate"
  - QR_CODE: "QR code credential"
  - BARCODE: "Barcode credential"
  - NFC: "Near-field communication credential"
  - BLUETOOTH: "Bluetooth-based credential"
  - OTHER: "Other or vendor-specific credential type"
