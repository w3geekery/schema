description: Level of access permissions granted by the credential
displayName: Access Credential Level
values:
  - VISITOR: "Temporary visitor access with minimal permissions"
  - EMPLOYEE: "Standard employee access to assigned areas"
  - CONTRACTOR: "Contractor access with time-limited permissions"
  - SUPERVISOR: "Supervisory access with extended area permissions"
  - SECURITY: "Security personnel access to restricted areas"
  - ADMIN: "Administrative access to all areas and systems"
  - EMERGENCY: "Emergency access for critical situations"
