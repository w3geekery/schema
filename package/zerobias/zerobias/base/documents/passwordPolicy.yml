id: 2abf19f2-fd5a-49b2-ac69-08966b978f6b
fieldId: 8c5b9dcf-f676-4c3a-8390-9adf3a85bfb3
description: "Describes how a system manages and checks passwords"
displayName: "Password Policy"
properties:
  - status:
    field: adminStatus
  - minLength:
    field:
        description: Minimum Length
        displayName: Minimum Length
        type: integer
  - maxLength:
    field:
        description: Maximum Length
        displayName: Maximum Length
        type: integer
  - requiredUpper:
    field:
        description: Number of required upper-case letters
        displayName: Required Upper
        type: integer
  - requiredLower:
    field:
        description: Number of required lower-case letters
        displayName: Required Lower
        type: integer
  - requiredDigits:
    field:
        description: Number of required digits 
        displayName: Required Digits
        type: integer
  - requiredSpecial:
    field:
        description: Number of required special / non-alphanumeric characters
        displayName: Required Special
        type: integer
  - passwordHistory:
    field:
        description: The number of saved passwords to prevent re-use
        displayName: Password History
        type: integer
  - reversible:
    field:
        description: True if the system uses reversible encryption for the password
        displayName: Reversible
        type: boolean
  - cipherAlgorithm:
    field: cipherAlgorithm
  - expirationPeriod:
    field:
        description: The maximum age of a password before it expires
        displayName: Expiration Period
        type: duration
