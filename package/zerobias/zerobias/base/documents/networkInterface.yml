id: b7c64d7d-2460-4abf-9b76-bd8e266aebfb
fieldId: 860a75cb-3021-410a-b7f7-e5d6be011069
description: "A network interface is the point of interconnection between a computer and a private or public network. A network interface is generally a network interface card (NIC), but does not have to have a physical form. Instead, the network interface can be implemented in software virtualization"
displayName: "Network Interface"
properties:
  - description:
  - deviceName:
    field: networkInterface.deviceName
    required: true
  - macAddress:
  - networkInterfaceType:
  - adminStatus:
  - operationalStatus:
  - speed:
    field: networkInterface.speed
  - isReceiveOnly:
    field: networkInterface.isReceiveOnly
  - vlanId:
  - mtu:
    field: networkInterface.mtu
  - ipInterface:
    type: ipInterface
    multi: true
